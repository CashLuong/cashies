<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Tiêu đề tab và Favicon tùy chỉnh -->
  <title>Cashies - Quản Lý Tài Chính</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💴</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">

  <!-- Màn hình Đăng nhập -->
  <div id="loginView" class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-sm w-full">
      <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
        💴
      </div>
      <h1 class="text-xl font-bold mb-2">Cashies</h1>
      <p class="text-sm text-slate-500 mb-6">Đăng nhập tài khoản Google để đồng bộ dữ liệu chi tiêu cá nhân.</p>
      <button id="btnLogin" class="w-full flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition duration-150 shadow-sm">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.8 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
        </svg>
        <span>Đăng nhập với Google</span>
      </button>
    </div>
  </div>

  <!-- Giao diện Chính (Ẩn cho đến khi đăng nhập) -->
  <div id="appView" class="hidden max-w-xl mx-auto px-4 pt-6 space-y-5">
    
    <!-- Top Bar -->
    <header class="flex items-center justify-between pb-2 border-b border-slate-200">
      <div>
        <h2 class="text-xs uppercase tracking-wider text-indigo-600 font-bold">Cashies</h2>
        <p id="userGreeting" class="font-bold text-slate-800 text-base"></p>
      </div>
      <button id="btnLogout" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-medium transition">
        Đăng xuất
      </button>
    </header>

    <!-- Bộ Lọc Tháng -->
    <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200">
      <span class="text-xs font-semibold text-slate-500 uppercase">Tháng hiển thị</span>
      <input type="month" id="filterMonth" class="text-sm font-semibold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 focus:outline-none focus:ring-1 focus:ring-slate-400">
    </div>

    <!-- Tổng Quan Số Liệu Hàng Tháng (Yên Nhật) -->
    <section class="grid grid-cols-3 gap-2.5">
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs">
        <p class="text-xs text-slate-400 font-medium">Tổng Thu</p>
        <p id="totalIncome" class="text-base font-bold text-emerald-600 mt-1">¥0</p>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs">
        <p class="text-xs text-slate-400 font-medium">Tổng Chi</p>
        <p id="totalExpense" class="text-base font-bold text-rose-600 mt-1">¥0</p>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs">
        <p class="text-xs text-slate-400 font-medium">Số Dư</p>
        <p id="netBalance" class="text-base font-bold text-slate-800 mt-1">¥0</p>
      </div>
    </section>

    <!-- Ngân Sách Tháng (Budget Bar) -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2">
      <div class="flex items-center justify-between text-xs">
        <span class="font-semibold text-slate-700">Ngân sách tháng</span>
        <div class="flex items-center gap-1">
          <span class="text-slate-400">Trần:</span>
          <button id="btnSetBudget" class="font-bold text-indigo-600 hover:underline">
            <span id="budgetDisplay">¥0</span>
          </button>
        </div>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
        <div id="budgetProgress" class="h-2.5 rounded-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="flex justify-between text-[11px] text-slate-400">
        <span id="budgetStatus">Chưa đặt hạn mức</span>
        <span id="budgetPercent">0%</span>
      </div>
    </section>

    <!-- Form Nhập Liệu / Quét Hóa Đơn -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">
        <h3 class="font-bold text-sm text-slate-800">Ghi nhận giao dịch</h3>
        
        <!-- Nút Quét Hóa Đơn bằng Gemini -->
        <label class="cursor-pointer inline-flex items-center gap-1.5 text-xs font-semibold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span id="scanStatus">Quét Hóa Đơn</span>
          <input type="file" id="receipt
